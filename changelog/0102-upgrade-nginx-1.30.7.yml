title: Upgrade nginx to 1.30.7
key: upgrade-nginx-1.30.7
date: 2026-11-19
optional_per_env: no
# (optional) Min version of HQ that MUST be deployed before this change can be rolled out (commit hash)
min_commcare_version:
# (optional) Max version of HQ that can be deployed before this change MUST be rolled out (commit hash)
max_commcare_version:
context: |
  nginx is upgraded from 1.28.0 to 1.30.7, the current stable release.

details: |
  nginx 1.30.7 includes several security fixes since 1.28.0,
  including a critical one released Nov 19, 2026.
  Timely application is essential to protecting a deployment.

update_steps: |
  To upgrade Nginx to 1.30.7 on CommCare HQ, please run the following command:

  Pull the latest version of commcare-cloud:
  ```bash
  git pull origin master
  ```

  Then run the deploy_proxy.yml playbook:

  ```bash
  cchq <env> ap deploy_proxy.yml
  ```
