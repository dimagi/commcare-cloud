- name: Logstash
  hosts: logproxy
  become: yes
  gather_facts: true
  vars:
    logstash_family: 7.x
    sansible_java_version: 8
    sansible_java_apt_keyserver: 'https://keyserver.ubuntu.com'
    logstash_version: 1:7.5.2-1
    logstash_plugins:
      - logstash-patterns-core
      - logstash-filter-alter
      - logstash-output-datadog_metrics
  tasks:
    - import_role:
        name: logstash
    - sysctl:
        name: net.core.rmem_max
        value: '26214400'
        state: present
  tags: logstash

- name: FileBeat
  hosts: proxy
  become: yes
  gather_facts: true
  vars:
    filebeat_version: 7.x
  tasks:
    - import_role:
        name: filebeat
  tags: filebeat
