- name: Logstash
  hosts: logproxy
  become: yes
  gather_facts: true
  tasks:
    - import_role:
        name: logstash
    - sysctl:
        name: net.core.rmem_max
        value: '26214400'
        state: present
  tags: logstash

- name: FileBeat
  hosts: proxy
  become: yes
  gather_facts: true
  tasks:
    - import_role:
        name: filebeat
  tags: filebeat
