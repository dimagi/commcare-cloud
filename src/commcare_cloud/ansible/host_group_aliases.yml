- name: "Create host group aliases"
  hosts: all
  tasks:
    - name: Create all_commcarehq group alias
      add_host:
        hostname: "{{ item }}"
        groups: all_commcarehq
      # empty after the first import in a run, when the group exists
      with_items: "{{ [] if 'all_commcarehq' in groups else groups['all'] }}"
      changed_when: no
    - name: Create commcarehq group alias
      add_host:
        hostname: "{{ item }}"
        groups: commcarehq
      with_items:
        - "{{ [] if 'commcarehq' in groups else groups['webworkers']|default([]) }}"
        - "{{ [] if 'commcarehq' in groups else groups['celery']|default([]) }}"
        - "{{ [] if 'commcarehq' in groups else groups['proxy']|default([]) }}"
        - "{{ [] if 'commcarehq' in groups else groups['pillowtop']|default([]) }}"
        - "{{ [] if 'commcarehq' in groups else groups['django_manage']|default([]) }}"
      changed_when: no
  tags:
    - always
