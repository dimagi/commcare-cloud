---
- name: Set bash prompt in bash.bashrc
  lineinfile:
    dest: "/etc/bash.bashrc"
    regexp: "^PS1=.*"
    line: "PS1={{ bash_PS1 }}"
    state: present

- name: Set bash prompt in bashrc skeleton
  lineinfile:
    dest: "/etc/skel/.bashrc"
    regexp: "^PS1=.*"
    line: "PS1={{ bash_PS1 }}"
    state: present

# To account for the default of 0750 on Jammy
# which is too strict for us
- name: Set DIR_MODE for adduser
  replace:
    path: /etc/adduser.conf
    regexp: '^DIR_MODE=0750'
    replace: 'DIR_MODE=0755'

- name: Set HOME_MODE for useradd
  replace:
    path: /etc/login.defs
    regexp: '^HOME_MODE\t0750'
    replace: 'HOME_MODE\t0755'

- name: Add ansible group
  group:
    name: ansible
    state: present
    gid: "{{ ansible_gid }}"
  tags:
    - new_ansible_sudo_pass
  when: "ansible_gid is not none and 'update_users' not in ansible_run_tags"

- name: Add cchq group
  group:
    name: "{{ cchq_group }}"
    state: present
    gid: "{{ cchq_gid }}"
  tags: commcarehq
  when: "cchq_gid is not none and 'update_users' not in ansible_run_tags"

- name: Add dev group
  group:
    name: "{{ dev_group }}"
    state: present
  tags: commcarehq

- name: Add ansible user
  user:
    name: ansible
    state: present
    shell: /bin/bash
    group: "{{ 'ansible' if ansible_gid and 'update_users' not in ansible_run_tags else omit }}"
    groups: "sudo"
    password: "{{ new_ansible_sudo_pass|default(ansible_sudo_pass)|password_hash('sha512', (inventory_hostname|hash('sha256'))[:16]) }}"
    uid: "{{ ansible_uid if ansible_uid and 'update_users' not in ansible_run_tags else omit }}"
    append: yes
  tags:
    - new_ansible_sudo_pass

- name: Add cchq user
  user:
    name: "{{ cchq_user }}"
    state: present
    shell: /bin/bash
    group: "{{ cchq_group if cchq_gid and 'update_users' not in ansible_run_tags else omit }}"
    groups: "{{ dev_group }}"
    uid: "{{ cchq_uid if cchq_uid and 'update_users' not in ansible_run_tags else omit }}"
    append: yes
  tags: commcarehq

- name: Create and/or set permissions on ansible log
  become: true
  file:
    path: /var/log/ansible.log
    mode: 0664
    owner: ansible
    group: "{{ dev_group }}"
    state: touch
  when: inventory_hostname in groups.get('control', [])

- name: Rotate ansible log
  include_role:
    name: ansible-logrotate
  vars:
    logrotate_scripts:
      - name: control_ansible
        path: /var/log/ansible.log
        options:
          - size 10M
          - rotate 5
          - missingok
          - compress
          - delaycompress
          - copytruncate
          - create
          - notifempty
  when: inventory_hostname in groups.get('control', [])

- name: Bootstrap dev users and SSH keys
  bootstrap_users:
    present: "{{ dict(dev_users.present | zip(query('file', *dev_pubkey_paths))) }}"
    absent: "{{ dev_users.absent }}"
    groups: ["{{ dev_group }}"]
    shell: /bin/bash
    shared_user: ansible
  vars:
    dev_pubkey_paths: "{{ [authorized_keys_dir] | product(dev_users.present, ['.pub']) | map('join') | list }}"

- name: Remove public key for cchq user
  # todo: remove after applied to all envs
  authorized_key:
    user: "{{ cchq_user }}"
    key: ''
    state: present
    exclusive: yes
  tags: commcarehq

- name: Find users with password max age set
  # shadow field 5 is max days; empty means no limit.
  command:
    argv: [awk, "-F:", '$5 != "" {print $1}', "/etc/shadow"]
  register: users_pw_max_age
  changed_when: false
  check_mode: false

- name: Clear users password valid time
  command: chage -M -1 "{{ item }}"
  loop: "{{ users_pw_max_age.stdout_lines | intersect(dev_users.present + ['ansible', cchq_user]) }}"


# This must be the last task in the file
# It disables factory auth (e.g. root user with password login)
# and this role has to be able to finish entirely using factory auth (to bootstrap the users)
- name: Copy sudoers file
  template:
    src: sudoers.j2
    dest: /etc/sudoers.d/cchq
    validate: 'visudo -cf %s'
    owner: root
    group: root
    mode: 0440
  tags:
    - sudoers
