---

- name: Add PostgreSQL apt repository
  import_role:
    name: apt_signed_repo
  vars:
    apt_signed_repo_name: pgdg

# Install base packages, common to all servers
- name: Install common packages
  become: yes
  apt:
    name:
      - build-essential
      - postgresql-client-common
      - postgresql-client-{{ postgresql_version }}
      - libxml2-dev
      - libxslt1-dev
      - tig # git browser
      - libpq-dev
      - curl
      - htop
      - tmpreaper # remove files older than x days
      - mailutils
      - at
      - screen
      - sysstat
      - gettext
      - mosh
      - libjpeg-dev
      - libfreetype6-dev
      - ranger  # cmdline file browser
      - libffi-dev  # Required for installing github3py
      - libssl-dev  # Required for pip setup tools and libcurl4-openssl-dev
      - tmux
      - reptyr # move process into tmux session
      - unzip
      - zip
      - iotop
      - ncdu # 'du' improved
      - monit # service restarter
      - libcairo2
      # libpango1.0-0 is a transitional package for these, removed in Ubuntu 24.04
      - libpango-1.0-0
      - libpangocairo-1.0-0
      - libpangoft2-1.0-0
      - auditd

# Install ntp package
- name: Install NTP package when Chrony is not defined.
  become: yes
  apt:
    name:
      - ntp
  when: not use_chrony

# Install chrony package
- name: Install chrony package
  become: yes
  apt:
    name:
      - chrony
  when: use_chrony

- name: add new line
  lineinfile:
    state: present
    dest: "/etc/chrony/chrony.conf"
    insertbefore: '^pool ntp.ubuntu.com '
    line: server 169.254.169.123 prefer iburst
  notify: restart chrony
  when: use_chrony

- name: Install common packages
  become: yes
  apt:
    name:
      - acl
      - software-properties-common
      - ufw
  when: ansible_distribution_version is version('22.04', '>=')

- name: Install uv
  # snap does a system-wide install with automatic updates
  become: yes
  community.general.snap:
    name: [astral-uv]
    classic: true

- name: Install pip packages
  become: yes
  pip:
    name:
      - sh
    umask: "0022"
  environment: "{{ pip_system_environment }}"

- name: Remove pip-installed uv
  become: yes
  pip:
    name: [uv]
    state: absent
  environment: "{{ pip_system_environment }}"
