- name: Pull source repo
  git:
    repo: "https://github.com/awslabs/amazon-kinesis-agent.git"
    dest: "{{ kinesis_agent_src_dir }}"
    version: "2.0.6"
    recursive: yes
    accept_hostkey: yes
    update: yes
  register: git_task
  when: (kinesis_flows | length)

- name: Install, configure kinesis-agent
  block:

    - name: Install from script
      command:
        cmd: "./setup --install"
        chdir: "{{ kinesis_agent_src_dir }}"
      environment:
        DEBUG: "1"
      register: install_task
      become: yes

  rescue:
    - name: Remove source repo so the next run retries the install
      file:
        path: "{{ kinesis_agent_src_dir }}"
        state: absent

    - name: Fail after removing source repo
      fail:
        msg: "kinesis-agent install failed: {{ install_task.stderr | default('') }}"

  when: (kinesis_flows | length) and git_task.changed
  tags: kinesis-agent

- name: Install, configure kinesis-agent
  block:
  - name: Create checkpoint file
    file:
      path: "{{ kinesis_agent_dir }}"
      owner: aws-kinesis-agent-user
      group: aws-kinesis-agent-user
      state: directory
      mode: '0755'

  - name: Create kinesis config
    template:
      src: "agent.json.j2"
      dest: "/etc/aws-kinesis/agent.json"
      group: root
      owner: root
      mode: 0644
    become: yes
    register: kinesis_conf

  - name: Restart kinesis agent service if changed
    service:
      name: aws-kinesis-agent
      state: restarted
    when: kinesis_conf.changed

  - name: Ensure service kinesis agent turned on
    service:
      name: aws-kinesis-agent
      state: started
  when:  kinesis_flows | length
  tags: kinesis-agent

