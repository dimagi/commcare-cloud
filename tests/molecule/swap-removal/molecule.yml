---
dependency:
  name: galaxy
  enabled: false
driver:
  name: containers
platforms:
  - name: instance
    image: docker.io/geerlingguy/docker-ubuntu2204-ansible
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    converge: ../swap-default/converge.yml
    cleanup: ../lib/stub.yml
    side_effect: ../lib/stub.yml
verifier:
  name: ansible
