---
dependency:
  name: shell
  command: ''
  enabled: false
driver:
  name: containers
platforms:
  - name: instance
    image: docker.io/geerlingguy/docker-ubuntu2204-ansible
    pre_build_image: true
    # The mount stub can't mount the data volume, so make encrypted_root a
    # mount point up front. Otherwise the role's mount task would mount it
    # again on every converge.
    tmpfs:
      - /opt/data
provisioner:
  name: ansible
  playbooks:
    converge: ../ecryptfs.default/converge.yml
    cleanup: ../lib/stub.yml
  inventory:
    group_vars:
      all:
        root_encryption_mode: ecryptfs
        encrypted_root: /opt/data
        encrypted_tmp: /opt/tmp
        shared_data_dir: /opt/shared_data
        shared_dir_gid: 1500
        shared_drive_enabled: false
        ECRYPTFS_PASSWORD: molecule-password
        ecryptfs_stub_sig: 0123456789abcdef
        datavol_device: /var/tmp/datavol
verifier:
  name: ansible
