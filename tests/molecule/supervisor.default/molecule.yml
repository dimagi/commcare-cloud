---
dependency:
  name: shell
  command: ''
  enabled: false
driver:
  name: containers
platforms:
  - name: instance
    image: docker.io/geerlingguy/docker-ubuntu2204-ansible
    pre_build_image: true

    # Let systemd run as PID 1, needed for the supervisord service.
    override_command: false
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp

provisioner:
  name: ansible
  playbooks:
    cleanup: ../lib/stub.yml
  inventory:
    group_vars:
      all:
        legacy_supervisor_task_conf: /home/cchq/legacy_services
        supervisor_task_conf: /home/cchq/services
verifier:
  name: ansible
