---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Assert supervisor commands come from the virtualenv
      ansible.builtin.command: readlink /usr/bin/{{ item }}
      register: link
      changed_when: false
      failed_when: link.stdout != '/opt/supervisor/bin/' ~ item
      loop:
        - supervisord
        - supervisorctl

    - name: Assert the old system-wide supervisor scripts are gone
      ansible.builtin.stat:
        path: /usr/local/bin/{{ item }}
      register: old_script
      failed_when: old_script.stat.exists
      loop:
        - supervisord
        - supervisorctl
        - echo_supervisord_conf
        - pidproxy

    - name: Assert supervisorctl on PATH is the virtualenv's
      # command-instead-of-shell: `command -v` is a shell builtin
      ansible.builtin.shell: command -v supervisorctl  # noqa: command-instead-of-shell
      register: on_path
      changed_when: false
      failed_when: on_path.stdout != '/usr/bin/supervisorctl'

    - name: Read supervisord and program PIDs from before converge
      ansible.builtin.slurp:
        src: /root/pids-before
      register: pids_before

    - name: Assert supervisord and the program were not restarted
      # This also checks the new supervisorctl can talk to the old supervisord
      ansible.builtin.shell: |
        echo "$(systemctl show -p MainPID --value supervisord) $(supervisorctl pid sleeper)"
      register: pids
      changed_when: false
      failed_when: pids.stdout != (pids_before.content | b64decode | trim)
