---
dependency:
  name: shell
  command: ''
  enabled: false
driver:
  name: containers
platforms:
  - name: instance
    image: docker.io/geerlingguy/docker-ubuntu2204-ansible
    pre_build_image: true
    groups:
      - shared_dir_host
provisioner:
  name: ansible
  playbooks:
    prepare: ../backups.cleanup/prepare.yml
    converge: ../backups.cleanup/converge.yml
    cleanup: ../lib/stub.yml
  inventory:
    group_vars:
      all:
        blobdb_backup_hourly: false
verifier:
  name: ansible
