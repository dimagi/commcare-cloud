---
dependency:
  name: shell
  command: ''
  enabled: false
driver:
  name: containers
platforms:
  - name: instance
    image: docker.io/geerlingguy/docker-ubuntu2204-ansible
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    cleanup: ../lib/stub.yml
    side_effect: ../lib/stub.yml
  inventory:
    group_vars:
      all:
        swap_size: 512M
verifier:
  name: ansible
