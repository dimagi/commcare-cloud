---
- name: Prepare
  hosts: all
  become: true
  tasks:
    - name: Stub killall
      ansible.builtin.copy:
        dest: /usr/local/bin/killall
        mode: "0755"
        content: |
          #!/bin/sh
          # Supports only `killall -g NAME`; kills just the named processes
          [ "$1" = "-g" ] || exit 2
          pkill -x "$2"
      tags: always

    - name: Start chaos
      ansible.builtin.import_role:
        name: chaos
        tasks_from: start
      tags: always  # make tasks run; molecule runs the scenario with --tags=stop
