name: molecule

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-22.04
    outputs:
      roles: ${{ steps.roles.outputs.roles }}
    steps:
    - uses: actions/checkout@v5
    - name: List roles
      id: roles
      run: |
        # tests/molecule/<role>.<scenario>/molecule.yml -> ["<role>", ...]
        roles=$(python3 - <<'EOF'
        import json, pathlib

        paths = pathlib.Path("tests/molecule").glob("*/molecule.yml")
        print(json.dumps(sorted({p.parent.name.partition(".")[0] for p in paths})))
        EOF
        )
        echo "roles=$roles" >> "$GITHUB_OUTPUT"

  role:
    needs: discover
    name: ${{ matrix.role }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        role: ${{ fromJSON(needs.discover.outputs.roles) }}
    env:
      MOLECULE_CONTAINERS_BACKEND: docker
    steps:
    - uses: actions/checkout@v5

    # Pulling the image takes 20-30s. Start it now so it overlaps the setup
    # steps below. It keeps running after this step ends. If it hasn't
    # finished when molecule creates the first container, `docker run` waits
    # for the in-progress download instead of starting another.
    - name: Start pulling container images
      env:
        ROLE: ${{ matrix.role }}
      run: |
        images=$(sed -n 's/^ *image: *//p' tests/molecule/"$ROLE".*/molecule.yml | sort -u)
        for image in $images; do
          nohup "$MOLECULE_CONTAINERS_BACKEND" pull --quiet "$image" >/dev/null 2>&1 &
        done

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Create ansible log file
      run: sudo install -m 644 -o "$USER" -g "$USER" /dev/null /var/log/ansible.log

    - name: Install dependencies
      run: uv sync --locked --group test

    - name: Run molecule tests
      env:
        MOLECULE_CONTAINERS_BACKEND: docker
      run: |
        source .venv/bin/activate
        ./tests/molecule/run.sh "${{ matrix.role }}"
