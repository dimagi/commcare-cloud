name: molecule

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-22.04
    outputs:
      roles: ${{ steps.roles.outputs.roles }}
    steps:
    - uses: actions/checkout@v5
    - name: List roles
      id: roles
      run: |
        # tests/molecule/<role>.<scenario>/molecule.yml -> ["<role>", ...]
        roles=$(python3 - <<'EOF'
        import json, pathlib

        paths = pathlib.Path("tests/molecule").glob("*/molecule.yml")
        print(json.dumps(sorted({p.parent.name.partition(".")[0] for p in paths})))
        EOF
        )
        echo "roles=$roles" >> "$GITHUB_OUTPUT"

  role:
    needs: discover
    name: ${{ matrix.role }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        role: ${{ fromJSON(needs.discover.outputs.roles) }}
    steps:
    - uses: actions/checkout@v5
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Create ansible log file
      run: sudo install -m 644 -o "$USER" -g "$USER" /dev/null /var/log/ansible.log

    - name: Install dependencies
      run: uv sync --locked --group test

    - name: Run molecule tests
      run: |
        source .venv/bin/activate
        ./tests/molecule/run.sh "${{ matrix.role }}"
